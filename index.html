<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
  </head>
  <body>
    <header>
      <div>
        <h2>TIC TAC TOE</h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </div>
    </header>
    <main>
      <div id="game">

      </div>
      <div id="informations">
        <div>
          <p id="player-turn"></p>
        </div>
        <div id="score-container">
          <p>SCORE</p>
          <div>
            <p>X</p>
            <p>PLAYER X</p>
            <p id="score-player-X"></p>
          </div>          
          <div>
            <p>O</p>
            <p>PLAYER O</p>
            <p id="score-player-O"></p>
          </div>
          <div>
            <p>O</p>
            <p>PLAYER O</p>
            <p id="score-player-O"></p>
          </div>
          <div>
            <p>——</p>
            <p>TEIS</p>
            <p id="score-tie"></p>
          </div>
          <div>
            <button><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>RESET GAME</button>
          </div>
        </div>
      </div>
    </main>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
